name: Build Vice Desk (Windows .exe + Android .apk)

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
    paths: ["app/**", "scripts/**", "android/**", "requirements.txt", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vice-desk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            app/requirements-app.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-app.txt

      - name: Fetch ffmpeg to bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/vendor/bin | Out-Null
          $urls = @("https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
                    "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip")
          foreach ($u in $urls) {
            try { Invoke-WebRequest -UseBasicParsing $u -OutFile ffmpeg.zip; break } catch { Write-Host "failed $u : $_" }
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x -Force
          Get-ChildItem ffmpeg-x -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination app/vendor/bin
          Get-ChildItem app/vendor/bin
          if (-not (Test-Path app/vendor/bin/ffmpeg.exe) -or -not (Test-Path app/vendor/bin/ffprobe.exe)) { throw "ffmpeg not found in archive" }

      - name: Bundle the Deno JavaScript runtime (YouTube needs one)
        shell: pwsh
        run: |
          $d = python -c "import deno; print(deno.find_deno_bin())"
          Copy-Item $d app/vendor/bin/deno.exe
          & app/vendor/bin/deno.exe --version

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('app/desk/core.py').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - name: Build ViceDesk.exe
        working-directory: app
        run: pyinstaller --noconfirm --clean vicedesk.spec

      - name: Smoke test the .exe
        working-directory: app
        shell: pwsh
        run: |
          $exe = (Resolve-Path ".\dist\ViceDesk.exe").Path
          function Invoke-Desk([string[]]$a) {
            $out = Join-Path $env:RUNNER_TEMP ("o" + [guid]::NewGuid() + ".txt")
            $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError "$out.err"
            $txt = (Get-Content $out -Raw) + (Get-Content "$out.err" -Raw)
            Write-Host "> $a (exit $($p.ExitCode))"; Write-Host $txt
            return $txt
          }
          if (-not (Invoke-Desk @("-m", "yt_dlp", "--version")).Trim()) { throw "bundled yt-dlp did not run" }
          foreach ($s in "check.py", "moments.py", "cut.py", "trends.py", "streams.py", "live.py") {
            if ((Invoke-Desk @("--script", $s, "--help")) -notmatch "usage: $s") { throw "$s failed to start" }
          }
          # GUI engine: start in browser mode on a fixed port and query the API
          $env:BROWSER = "none"
          $p = Start-Process -FilePath $exe -ArgumentList "--browser","--port","8765" -PassThru
          Start-Sleep -Seconds 20
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/
          if ($r.Content -notmatch "Vice Desk") { throw "UI not served" }
          $tok = [regex]::Match($r.Content, 'DESK_TOKEN = "([^"]+)"').Groups[1].Value
          $s = Invoke-RestMethod -Headers @{ "X-Desk-Token" = $tok } http://127.0.0.1:8765/api/status
          Write-Host ($s | ConvertTo-Json -Depth 4)
          if (-not $s.tools.ffmpeg.ok -or $s.tools.ffmpeg.path -notmatch "_MEI") { throw "bundled ffmpeg not used: $($s.tools.ffmpeg.path)" }
          if (-not $s.first_run) { throw "first-run model picker should show on a clean machine" }
          Stop-Process -Id $p.Id -Force
          Get-Item $exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: app/dist/ViceDesk.exe
          if-no-files-found: error


  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy compiles the app's Python with a host Python of the same version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Fetch static arm64 tools (ffmpeg, ffprobe, QuickJS)
        run: |
          set -e
          L=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p $L
          curl -fsSL -o $L/libffmpeg.so  https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-linux-arm64
          curl -fsSL -o $L/libffprobe.so https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffprobe-linux-arm64
          curl -fsSL -o $L/libqjs.so     https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-linux-aarch64
          chmod +x $L/*.so
          file $L/*.so
          file $L/*.so | grep -q "dynamically linked" && { echo "tools must be static"; exit 1; } || true

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Check APK contents
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          unzip -l "$APK" | grep -E "lib/arm64-v8a/lib(ffmpeg|ffprobe|qjs).so|bundle/scripts/moments.py|bundle/ui/index.html"
          for f in libffmpeg.so libffprobe.so libqjs.so; do unzip -l "$APK" | grep -q "lib/arm64-v8a/$f" || { echo "missing $f"; exit 1; }; done
          mkdir -p out && cp "$APK" out/ViceDesk.apk && ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/ViceDesk.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(python3 -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('app/desk/core.py').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Name the files
        run: |
          mv dist/ViceDesk.apk "dist/ViceDesk-${{ steps.ver.outputs.version }}.apk"
          ls -la dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Vice Desk ${{ steps.ver.outputs.version }} (Windows + Android)
          body_path: app/RELEASE_NOTES.md
          files: |
            dist/ViceDesk.exe
            dist/ViceDesk-${{ steps.ver.outputs.version }}.apk
          make_latest: true
          overwrite_files: true
