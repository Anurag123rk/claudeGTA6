name: Build Vice Desk (Windows, macOS, Linux, Android)

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
    paths: ["app/**", "scripts/**", "android/**", "requirements.txt", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vice-desk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            app/requirements-app.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-app.txt

      - name: Fetch ffmpeg to bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/vendor/bin | Out-Null
          $urls = @("https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
                    "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip")
          foreach ($u in $urls) {
            try { Invoke-WebRequest -UseBasicParsing $u -OutFile ffmpeg.zip; break } catch { Write-Host "failed $u : $_" }
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x -Force
          Get-ChildItem ffmpeg-x -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination app/vendor/bin
          Get-ChildItem app/vendor/bin
          if (-not (Test-Path app/vendor/bin/ffmpeg.exe) -or -not (Test-Path app/vendor/bin/ffprobe.exe)) { throw "ffmpeg not found in archive" }

      - name: Bundle the Deno JavaScript runtime (YouTube needs one)
        shell: pwsh
        run: |
          $d = python -c "import deno; print(deno.find_deno_bin())"
          Copy-Item $d app/vendor/bin/deno.exe
          & app/vendor/bin/deno.exe --version

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('app/desk/core.py').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - name: Build ViceDesk.exe
        working-directory: app
        run: pyinstaller --noconfirm --clean vicedesk.spec

      - name: Smoke test the .exe
        working-directory: app
        shell: pwsh
        run: |
          $exe = (Resolve-Path ".\dist\ViceDesk.exe").Path
          function Invoke-Desk([string[]]$a) {
            $out = Join-Path $env:RUNNER_TEMP ("o" + [guid]::NewGuid() + ".txt")
            $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError "$out.err"
            $txt = (Get-Content $out -Raw) + (Get-Content "$out.err" -Raw)
            Write-Host "> $a (exit $($p.ExitCode))"; Write-Host $txt
            return $txt
          }
          if (-not (Invoke-Desk @("-m", "yt_dlp", "--version")).Trim()) { throw "bundled yt-dlp did not run" }
          foreach ($s in "check.py", "moments.py", "cut.py", "trends.py", "streams.py", "live.py") {
            if ((Invoke-Desk @("--script", $s, "--help")) -notmatch "usage: $s") { throw "$s failed to start" }
          }
          # GUI engine: start in browser mode on a fixed port and query the API
          $env:BROWSER = "none"
          $p = Start-Process -FilePath $exe -ArgumentList "--browser","--port","8765" -PassThru
          Start-Sleep -Seconds 20
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/
          if ($r.Content -notmatch "Vice Desk") { throw "UI not served" }
          $tok = [regex]::Match($r.Content, 'DESK_TOKEN = "([^"]+)"').Groups[1].Value
          $s = Invoke-RestMethod -Headers @{ "X-Desk-Token" = $tok } http://127.0.0.1:8765/api/status
          Write-Host ($s | ConvertTo-Json -Depth 4)
          if (-not $s.tools.ffmpeg.ok -or $s.tools.ffmpeg.path -notmatch "_MEI") { throw "bundled ffmpeg not used: $($s.tools.ffmpeg.path)" }
          if (-not $s.first_run) { throw "first-run model picker should show on a clean machine" }
          Stop-Process -Id $p.Id -Force
          Get-Item $exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: app/dist/ViceDesk.exe
          if-no-files-found: error


  desktop-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple silicon
            tag: mac-arm64
            ff: darwin-arm64
          - os: ubuntu-22.04      # older glibc = runs on more distros
            tag: linux-x86_64
            ff: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements-app.txt

      - name: Bundle ffmpeg, ffprobe and Deno
        run: |
          set -e
          mkdir -p app/vendor/bin
          curl -fsSL -o app/vendor/bin/ffmpeg  https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-${{ matrix.ff }}
          curl -fsSL -o app/vendor/bin/ffprobe https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffprobe-${{ matrix.ff }}
          cp "$(python -c 'import deno; print(deno.find_deno_bin())')" app/vendor/bin/deno
          chmod +x app/vendor/bin/*
          if [ "$RUNNER_OS" = "macOS" ]; then codesign --force -s - app/vendor/bin/*; fi
          app/vendor/bin/ffmpeg -version | head -1
          app/vendor/bin/deno --version | head -1

      - name: Read version
        id: ver
        run: echo "version=$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('app/desk/core.py').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: app
        env:
          VICE_VERSION: ${{ steps.ver.outputs.version }}
        run: pyinstaller --noconfirm --clean vicedesk.spec

      - name: Smoke test
        run: |
          set -e
          if [ "$RUNNER_OS" = "macOS" ]; then BIN="app/dist/Vice Desk.app/Contents/MacOS/ViceDesk"; else BIN=app/dist/ViceDesk; fi
          "$BIN" -m yt_dlp --version
          "$BIN" --script check.py --help | grep -q "usage: check.py"
          "$BIN" --script cut.py --help | grep -q "punch"
          BROWSER=true "$BIN" --browser --port 8765 > gui.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8765/ > page.html && break; sleep 1; done
          TOK=$(grep -o 'DESK_TOKEN = "[^"]*"' page.html | cut -d'"' -f2)
          curl -fs -H "X-Desk-Token: $TOK" http://127.0.0.1:8765/api/status | tee status.json
          python -c "import json; s=json.load(open('status.json')); t=s['tools']; assert t['ffmpeg']['ok'] and t['yt-dlp']['ok'], t; print('ffmpeg:', t['ffmpeg']['path'])"
          kill %1 || true

      - name: Package
        run: |
          set -e
          mkdir -p out
          if [ "$RUNNER_OS" = "macOS" ]; then
            hdiutil create -volname "Vice Desk" -srcfolder "app/dist/Vice Desk.app" -ov -format UDZO "out/ViceDesk-${{ steps.ver.outputs.version }}-${{ matrix.tag }}.dmg"
          else
            cp app/dist/ViceDesk "out/ViceDesk-${{ steps.ver.outputs.version }}-${{ matrix.tag }}"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.tag }}
          path: out/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy compiles the app's Python with a host Python of the same version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ubuntu-latest ships the Android SDK (ANDROID_HOME) with licenses accepted; AGP installs missing parts
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Android builds of ffmpeg/ffprobe (with libass, x264) and QuickJS from youtubedl-android, the same
      # binaries the Seal and YTDLnis apps ship. Generic Linux builds cannot run inside an Android app.
      - name: Fetch Android tools (ffmpeg, ffprobe, QuickJS)
        env:
          YTDLA: https://repo.maven.apache.org/maven2/io/github/junkfood02/youtubedl-android
          YTDLA_VERSION: "0.18.1"
        run: |
          set -e
          L=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p $L aar
          curl -fsSL -o aar/ffmpeg.aar  "$YTDLA/ffmpeg/$YTDLA_VERSION/ffmpeg-$YTDLA_VERSION.aar"
          curl -fsSL -o aar/library.aar "$YTDLA/library/$YTDLA_VERSION/library-$YTDLA_VERSION.aar"
          unzip -o -j aar/ffmpeg.aar  "jni/arm64-v8a/libffmpeg.so" "jni/arm64-v8a/libffprobe.so" "jni/arm64-v8a/libffmpeg.zip.so" -d $L
          unzip -o -j aar/library.aar "jni/arm64-v8a/libqjs.so" -d $L
          file $L/*.so
          for f in libffmpeg.so libffprobe.so libqjs.so; do file $L/$f | grep -q "linker64" || { echo "$f is not an Android executable"; exit 1; }; done
          unzip -l $L/libffmpeg.zip.so | grep -q "usr/lib/libass.so" || { echo "ffmpeg libs missing libass"; exit 1; }
          # runtime libs ffmpeg shares with youtubedl-android's Python package (libc++_shared, libcrypto, libexpat...)
          unzip -o -j aar/library.aar "jni/arm64-v8a/libpython.zip.so" -d aar
          mkdir -p aar/deps && unzip -q aar/libpython.zip.so 'usr/lib/libandroid-posix-semaphore*' 'usr/lib/libandroid-support*' \
            'usr/lib/libc++_shared*' 'usr/lib/libcrypto*' 'usr/lib/libexpat*' -d aar/deps
          (cd aar/deps && zip -q -y -r "$GITHUB_WORKSPACE/$L/libffdeps.zip.so" usr)
          # every library ffmpeg/ffprobe load must be in the zips (or be an Android system library)
          python3 - "$L" <<'PY'
          import subprocess, sys
          from pathlib import Path
          L = Path(sys.argv[1])
          import tempfile; tmp = Path(tempfile.mkdtemp())
          for z in ("libffmpeg.zip.so", "libffdeps.zip.so"):  # unzip keeps symlinks (zipfile does not)
              subprocess.run(["unzip", "-q", "-o", str(L / z), "-d", str(tmp)], check=True)
          def needed(f):
              out = subprocess.run(["readelf", "-d", str(f)], capture_output=True, text=True).stdout
              return [x.split("[")[1].rstrip("]") for x in out.splitlines() if "NEEDED" in x]
          system = {"libc.so", "libm.so", "libdl.so", "liblog.so", "libz.so"}
          for exe in ("libffmpeg.so", "libffprobe.so"):
              seen, todo, missing = set(), needed(L / exe), set()
              while todo:
                  n = todo.pop()
                  if n in seen: continue
                  seen.add(n); f = tmp / "usr/lib" / n
                  if f.exists(): todo += needed(f.resolve())
                  elif n not in system: missing.add(n)
              print(exe, len(seen), "libs, unresolved:", sorted(missing))
              if missing: sys.exit(f"{exe} would fail to start: missing {sorted(missing)}")
          PY

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Check APK contents
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          unzip -l "$APK" | grep -E "lib/arm64-v8a/lib(ffmpeg|ffprobe|qjs).so|bundle/scripts/moments.py|bundle/ui/index.html"
          for f in libffmpeg.so libffprobe.so libffmpeg.zip.so libffdeps.zip.so libqjs.so; do unzip -l "$APK" | grep -q "lib/arm64-v8a/$f" || { echo "missing $f"; exit 1; }; done
          mkdir -p out && cp "$APK" out/ViceDesk.apk && ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/ViceDesk.apk
          if-no-files-found: error

  release:
    needs: [windows, desktop-unix, android]
    # publish even if an optional desktop build (macOS runners may be unavailable to this repo) did not run
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(python3 -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('app/desk/core.py').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Name the files
        run: |
          mv dist/ViceDesk.apk "dist/ViceDesk-${{ steps.ver.outputs.version }}.apk"
          ls -la dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Vice Desk ${{ steps.ver.outputs.version }} (Windows, macOS, Linux, Android)
          body_path: app/RELEASE_NOTES.md
          files: |
            dist/ViceDesk.exe
            dist/ViceDesk-${{ steps.ver.outputs.version }}.apk
            dist/ViceDesk-${{ steps.ver.outputs.version }}-mac-arm64.dmg
            dist/ViceDesk-${{ steps.ver.outputs.version }}-linux-x86_64
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: false
